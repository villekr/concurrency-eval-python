[project]
name = "concurrency-eval-python"
version = "0.2.0"
description = "Python code for [How Do You Like Your Lambda Concurrency](https://ville-karkkainen.medium.com/how-do-you-like-your-aws-lambda-concurrency-part-1-introduction-7a3f7ecfe4b5)-blog series."
authors = ["Ville Kärkkäinen <ville.karkkainen@outlook.com>"]
readme = "README.md"
requires-python = ">=3.14"
# boto3 is shared by every implementation (serial, aioboto3 and tonio).
dependencies = [
    "boto3>=1.40.61",
]

# Alternative, mutually exclusive runtime stacks. Each implementation pulls in
# only what it needs:
#   - "async": aioboto3 asyncio implementation (lambda_function.py), zip-based.
#   - "ft":    free-threaded TonIO implementation (lambda_function_ft.py),
#              container-image based. tonio ships wheels only for free-threaded
#              CPython (cp314t/cp315t) and is Unix-only, so it is installed only
#              inside the container image (see Dockerfile / requirements-ft.txt)
#              and never in the standard GIL environment used for ruff/lizard.
# When TonIO is used, aioboto3 is unnecessary (TonIO is not asyncio-compatible),
# which is why these are kept apart.
[project.optional-dependencies]
async = [
    "aioboto3>=15.5.0",
]
ft = [
    "tonio>=0.9.15 ; platform_system != 'Windows'",
    "awslambdaric>=4.0.2 ; platform_system != 'Windows'",
]

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # isort
    "I",
    "F"
]

[dependency-groups]
dev = [
    "lizard>=1.24.0",
    "ruff>=0.16.6",
]

